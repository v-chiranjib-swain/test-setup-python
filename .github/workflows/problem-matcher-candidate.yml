name: Python problem matcher candidate

# This workflow verifies which Python exceptions are detected and annotated by
# the candidate problem matcher.
on:
  workflow_dispatch:

jobs:
  problem-matcher:
    name: ${{ matrix.testcase }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        testcase:
          - index_error
          - key_error
          - type_error
          - value_error
          - zero_division
          - file_not_found
          - import_error
          - module_not_found
          - attribute_error
          - runtime_error
          - assertion_error
          - custom_exception
          - syntax_error

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@82009b3bde52ba09eae338d59adb1c06ac50c997
        with:
          python-version: "3.10"

      # Each failure is expected; inspect its annotation to test the matcher.
      - name: Run ${{ matrix.testcase }}
        run: python tests/${{ matrix.testcase }}.py

name: Sequential OS-scoped tool-cache test

on:
  workflow_dispatch:

jobs:
  ubuntu-20:
    runs-on: [self-hosted, Linux, X64, setup-python-race-1]
    container: ubuntu:20.04
    env:
      AGENT_TOOLSDIRECTORY: /opt/hostedtoolcache

    steps:
      - name: Check runner cache configuration
        run: |
          echo "AGENT_TOOLSDIRECTORY=$AGENT_TOOLSDIRECTORY"
          echo "RUNNER_TOOL_CACHE=$RUNNER_TOOL_CACHE"
          cat /etc/os-release

      - name: Install SSL prerequisites
        run: |
          apt-get update
          apt-get install -y ca-certificates
          case "$(. /etc/os-release && echo "$VERSION_ID")" in
            20.04) apt-get install -y libssl1.1 ;;
            24.04) apt-get install -y libssl3 ;;
            *) echo "Unsupported Ubuntu version"; exit 1 ;;
          esac

      - name: Set up Python 3.12.6
        id: setup-python
        uses: v-gowridurgad/setup-python@feature-1087
        with:
          python-version: "3.12.6"
          scope-cache-by-os: true

      - name: Inspect Python cache paths
        if: always()
        run: |
          echo "OS:"
          cat /etc/os-release

          echo "AGENT_TOOLSDIRECTORY=$AGENT_TOOLSDIRECTORY"
          echo "RUNNER_TOOL_CACHE=$RUNNER_TOOL_CACHE"

          echo "Cache directories:"
          find /opt/hostedtoolcache/Python/3.12.6 \
            -maxdepth 2 -type d -print 2>/dev/null || true

          echo "Python executable:"
          command -v python || true
          python --version || true

      - name: Diagnose Python SSL
        if: always()
        run: |
          python --version
          python -c "import sys; print(sys.executable)"

          ssl_ext=$(python -c "import _ssl; print(_ssl.__file__)" 2>/dev/null || true)

          if [ -n "$ssl_ext" ]; then
            echo "SSL extension: $ssl_ext"
            python -c "import ssl; print(ssl.OPENSSL_VERSION)"
            ldd "$ssl_ext" || true
          else
            echo "ERROR: Python cannot load the _ssl module"
            find "$AGENT_TOOLSDIRECTORY/Python/3.12.6" \
              -name '_ssl*.so' -print 2>/dev/null || true
          fi

          python -m pip --version || true

      - name: Verify Ubuntu 20.04 installation
        run: |
          python --version
          python -c "import sys; print(sys.executable)"
          python -c "import ssl; print(ssl.OPENSSL_VERSION)"
          python -m pip --version

          test -d "$AGENT_TOOLSDIRECTORY/Python/3.12.6/x64-ubuntu-20.04"

          echo "Ubuntu 20.04 installation verified"

  ubuntu-24:
    needs: ubuntu-20
    runs-on: [self-hosted, Linux, X64, setup-python-race-2]
    container: ubuntu:24.04
    env:
      AGENT_TOOLSDIRECTORY: /opt/hostedtoolcache

    steps:
      - name: Check runner cache configuration
        run: |
          echo "AGENT_TOOLSDIRECTORY=$AGENT_TOOLSDIRECTORY"
          echo "RUNNER_TOOL_CACHE=$RUNNER_TOOL_CACHE"
          cat /etc/os-release

      - name: Install SSL prerequisites
        run: |
          apt-get update
          apt-get install -y ca-certificates
          case "$(. /etc/os-release && echo "$VERSION_ID")" in
            20.04) apt-get install -y libssl1.1 ;;
            24.04) apt-get install -y libssl3 ;;
            *) echo "Unsupported Ubuntu version"; exit 1 ;;
          esac


      - name: Set up Python 3.12.6
        id: setup-python
        uses: v-gowridurgad/setup-python@feature-1087
        with:
          python-version: "3.12.6"
          scope-cache-by-os: true

      - name: Inspect Python cache paths
        if: always()
        run: |
          echo "OS:"
          cat /etc/os-release

          echo "AGENT_TOOLSDIRECTORY=$AGENT_TOOLSDIRECTORY"
          echo "RUNNER_TOOL_CACHE=$RUNNER_TOOL_CACHE"

          echo "Cache directories:"
          find /opt/hostedtoolcache/Python/3.12.6 \
            -maxdepth 2 -type d -print 2>/dev/null || true

          echo "Python executable:"
          command -v python || true
          python --version || true

      - name: Diagnose Python SSL
        if: always()
        run: |
          python --version
          python -c "import sys; print(sys.executable)"

          ssl_ext=$(python -c "import _ssl; print(_ssl.__file__)" 2>/dev/null || true)

          if [ -n "$ssl_ext" ]; then
            echo "SSL extension: $ssl_ext"
            python -c "import ssl; print(ssl.OPENSSL_VERSION)"
            ldd "$ssl_ext" || true
          else
            echo "ERROR: Python cannot load the _ssl module"
            find "$AGENT_TOOLSDIRECTORY/Python/3.12.6" \
              -name '_ssl*.so' -print 2>/dev/null || true
          fi

          python -m pip --version || true

      - name: Verify Ubuntu 24.04 installation and both cache directories
        run: |
          python --version
          python -c "import sys; print(sys.executable)"
          python -c "import ssl; print(ssl.OPENSSL_VERSION)"
          python -m pip --version

          # test -d "$AGENT_TOOLSDIRECTORY/Python/3.12.6/x64-ubuntu-20.04"
          test -d "$AGENT_TOOLSDIRECTORY/Python/3.12.6/x64-ubuntu-24.04"

          echo "Both OS-scoped cache directories exist"

name: Concurrent Python Cache Test

on:
  workflow_dispatch:

jobs:
  runner-1:
    runs-on: [self-hosted, Linux, X64, setup-python-race-1]
    steps:
      - name: Configure writable Python tool cache
        shell: bash
        run: |
          tool_cache="$RUNNER_TEMP/hostedtoolcache"
          mkdir -p "$tool_cache"
          echo "AGENT_TOOLSDIRECTORY=$tool_cache" >> "$GITHUB_ENV"

      - name: Inspect cache configuration
        run: |
          echo "Runner: $RUNNER_NAME"
          echo "RUNNER_TOOL_CACHE=${RUNNER_TOOL_CACHE:-<unset>}"
          echo "AGENT_TOOLSDIRECTORY=$AGENT_TOOLSDIRECTORY"

      - name: Install Python
        uses: v-gowridurgad/setup-python@feature-1087
        with:
          python-version: '3.12.6'
          scope-cache-by-os: true

      - name: Verify Python
        run: |
          python --version
          which python
          ls -la "$AGENT_TOOLSDIRECTORY/Python/3.12.6" || true

  runner-2:
    runs-on: [self-hosted, Linux, X64, setup-python-race-2]
    steps:
      - name: Configure writable Python tool cache
        shell: bash
        run: |
          tool_cache="$RUNNER_TEMP/hostedtoolcache"
          mkdir -p "$tool_cache"
          echo "AGENT_TOOLSDIRECTORY=$tool_cache" >> "$GITHUB_ENV"

      - name: Inspect cache configuration
        run: |
          echo "Runner: $RUNNER_NAME"
          echo "RUNNER_TOOL_CACHE=${RUNNER_TOOL_CACHE:-<unset>}"
          echo "AGENT_TOOLSDIRECTORY=$AGENT_TOOLSDIRECTORY"

      - name: Install Python
        uses: v-gowridurgad/setup-python@feature-1087
        with:
          python-version: '3.12.6'
          scope-cache-by-os: true

      - name: Verify Python
        run: |
          python --version
          which python
          ls -la "$AGENT_TOOLSDIRECTORY/Python/3.12.6" || true

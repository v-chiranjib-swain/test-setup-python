name: Runner Tool Cache Check

on:
  workflow_dispatch:

jobs:
  runner-1:
    runs-on: [self-hosted, Linux, X64, setup-python-race-1]
    env:
      AGENT_TOOLSDIRECTORY: /opt/hostedtoolcache
    steps:
      - name: Inspect runner environment
        run: |
          echo "Runner: $RUNNER_NAME"
          echo "RUNNER_TOOL_CACHE=${RUNNER_TOOL_CACHE:-<unset>}"
          echo "AGENT_TOOLSDIRECTORY=${AGENT_TOOLSDIRECTORY:-<unset>}"
          echo "RUNNER_TEMP=$RUNNER_TEMP"
          echo "RUNNER_WORKSPACE=$RUNNER_WORKSPACE"

  runner-2:
    runs-on: [self-hosted, Linux, X64, setup-python-race-2]
    env:
      AGENT_TOOLSDIRECTORY: /opt/hostedtoolcache
    steps:
      - name: Inspect runner environment
        run: |
          echo "Runner: $RUNNER_NAME"
          echo "RUNNER_TOOL_CACHE=${RUNNER_TOOL_CACHE:-<unset>}"
          echo "AGENT_TOOLSDIRECTORY=${AGENT_TOOLSDIRECTORY:-<unset>}"
          echo "RUNNER_TEMP=$RUNNER_TEMP"
          echo "RUNNER_WORKSPACE=$RUNNER_WORKSPACE"

name: Concurrent Python Cache Test

on:
  workflow_dispatch:

jobs:
  runner-1:
    runs-on: [self-hosted, Linux, X64, setup-python-race-1]
    env:
      AGENT_TOOLSDIRECTORY: /opt/hostedtoolcache
    steps:
      - name: Inspect cache configuration
        run: |
          echo "Runner: $RUNNER_NAME"
          echo "RUNNER_TOOL_CACHE=${RUNNER_TOOL_CACHE:-<unset>}"
          echo "AGENT_TOOLSDIRECTORY=$AGENT_TOOLSDIRECTORY"

      - name: Install Python
        uses: v-gowridurgad/setup-python@feature-1087
        with:
          python-version: '3.12.6'
          scope-cache-by-os: true

      - name: Verify Python
        run: |
          python --version
          which python
          ls -la "$RUNNER_TOOL_CACHE/Python/3.12.6" || true

  runner-2:
    runs-on: [self-hosted, Linux, X64, setup-python-race-2]
    env:
      AGENT_TOOLSDIRECTORY: /opt/hostedtoolcache
    steps:
      - name: Inspect cache configuration
        run: |
          echo "Runner: $RUNNER_NAME"
          echo "RUNNER_TOOL_CACHE=${RUNNER_TOOL_CACHE:-<unset>}"
          echo "AGENT_TOOLSDIRECTORY=$AGENT_TOOLSDIRECTORY"

      - name: Install Python
        uses: v-gowridurgad/setup-python@feature-1087
        with:
          python-version: '3.12.6'
          scope-cache-by-os: true

      - name: Verify Python
        run: |
          python --version
          which python
          ls -la "$RUNNER_TOOL_CACHE/Python/3.12.6" || true
